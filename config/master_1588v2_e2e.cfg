# IEEE 1588v2 L2 E2E Master
# 适用于交换机多源授时，实测 Pandar64 可锁定。
# 雷达侧需配置: PTPProfile=0(1588v2), Domain=1, Network=L2
[global]
domainNumber		1
logAnnounceInterval	0
logSyncInterval		-3
syncReceiptTimeout	3
transportSpecific	0
ptp_dst_mac		01:1B:19:00:00:00
network_transport	L2
delay_mechanism		E2E
time_stamping		hardware
step_threshold		1
